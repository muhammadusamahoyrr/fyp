name: tests

on:
  push:
    branches: [master, main]
  pull_request:
  # Manual runs only: the `live` job below runs nowhere else.
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      # Integration tests (checkpointer, document ACL) need a real Mongo. Without
      # it they self-skip, which would quietly hide the security tests — so CI
      # provides one rather than letting them disappear.
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          # BOTH files, or the cache key ignores a change to the test tooling
          # and a stale wheel set is restored over it.
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        # requirements-dev.txt, not requirements.txt: pytest, pytest-asyncio and
        # fakeredis are test tooling and live there. The runtime file has none of
        # them, so installing it alone produced `pytest: command not found` and
        # a job that failed before running a single test.
        #
        # `-r requirements.txt` is the first line of the dev file, so this
        # installs the runtime dependencies too.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify the test runner is installed
        # A one-line guard against the failure this job just had: a missing
        # runner reports `command not found`, which reads like a broken shell
        # rather than a missing dependency and cost a round trip to diagnose.
        run: python -m pytest --version

      - name: Unit + E2E tests (no external services)
        # The bulk of the suite: offline, deterministic, no DB, no LLM.
        run: python -m pytest -m "not integration and not llm"

      - name: Integration tests (MongoDB)
        env:
          # Names must match app/core/config.py Settings fields (pydantic-settings
          # reads them case-insensitively): mongodb_url and db_name.
          MONGODB_URL: mongodb://localhost:27017
          DB_NAME: attorney_ai_test
        run: python -m pytest -m integration

  live:
    # The LIVE tier (markers `llm` and `network`): real provider calls and
    # anything that needs the public internet. Never on push or PR -- it
    # spends tokens and depends on third parties -- only when started by hand.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-test-only-not-a-secret-0f3c9a1e7b2d4c6a8e0f1a3b5c7d9e1f
      ENCRYPTION_KEY: ByF5j6V-gNj5ET4SS3nINM8oB1YFSOywjB1kallqieE=  # test-only Fernet key
      AAI_LIVE_TESTS: "1"
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Live tier
        run: python -m pytest -m "llm or network" tests/test_live_tier.py
