name: tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      # Integration tests (checkpointer, document ACL) need a real Mongo. Without
      # it they self-skip, which would quietly hide the security tests — so CI
      # provides one rather than letting them disappear.
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit + E2E tests (no external services)
        # The bulk of the suite: offline, deterministic, no DB, no LLM.
        run: pytest -m "not integration and not llm"

      - name: Integration tests (MongoDB)
        env:
          # Names must match app/core/config.py Settings fields (pydantic-settings
          # reads them case-insensitively): mongodb_url and db_name.
          MONGODB_URL: mongodb://localhost:27017
          DB_NAME: attorney_ai_test
        run: pytest -m integration
