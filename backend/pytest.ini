[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*

# auto: async test functions run without needing an explicit @pytest.mark.asyncio
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

markers =
    integration: needs a live backing service (MongoDB). Deselect with: -m "not integration"
    llm: calls a real LLM provider — costs tokens and is non-deterministic. Skipped unless AAI_LIVE_TESTS=1
    network: reaches the public internet (e.g. official law publishers). Skipped unless AAI_LIVE_TESTS=1
    real_repository_root: asserts on the real REPOSITORY_ROOT; opts out of the fake-root fixture
    real_protection: exercises the genuine owner-only ACL/chmod path, which is slow

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

addopts = -q --strict-markers
