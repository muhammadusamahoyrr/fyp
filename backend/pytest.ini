[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*

# auto: async test functions run without needing an explicit @pytest.mark.asyncio
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

markers =
    integration: needs a live backing service (MongoDB). Deselect with: -m "not integration"
    llm: calls a real LLM provider — costs tokens and is non-deterministic. Deselect with: -m "not llm"

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

addopts = -q --strict-markers
