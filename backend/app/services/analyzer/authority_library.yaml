- statute: Punjab Rented Premises Act 2009
  section: '5'
  heading: Agreement between landlord and tenant
  source: punjab_rented_premises_act_2009
  pages:
  - 4
  - 5
  text: |-
    5. Agreement between landlord and tenant.– (1) A landlord shall not let out a
    premises to a tenant except by a tenancy agreement.
    (2) A landlord shall present the tenancy agreement before the Rent
    Registrar.
    (3) The Rent Registrar shall enter the particulars of the tenancy in a
    register, affix his official seal on the tenancy agreement, retain a copy thereof and
    return the original tenancy agreement to the landlord.
    (4) The entry of particulars of the tenancy shall not absolve the landlord or
    the tenant of their liability to register the tenancy agreement under the law relating to
    registration of documents.
    (5) A tenancy agreement entered in the office of a Rent Registrar or a
    certified copy thereof shall be a proof of the relationship of landlord and tenant.
    (6) Any agreement which may be executed between the landlord and the
    tenant in respect of the premises shall be presented before the Rent Registrar in the
    same manner as provided in sub-section (2).
  text_sha256: de6771742e3b134b3c3768b2e792f830b8999c03d5d929b5bf7c21f2975db903
- statute: Punjab Rented Premises Act 2009
  section: '6'
  heading: Contents of tenancy agreement
  source: punjab_rented_premises_act_2009
  pages:
  - 5
  text: |-
    6. Contents of tenancy agreement.– (1) A tenancy agreement shall contain, as
    far as possible, the following:
    (a) particulars of the landlord and the tenant;
    (b) description of the premises;
    (c) period of the tenancy;
    (d) rate of rent, rate of enhancement, due date and mode of payment of
    rent;
    (e) particulars of the bank account of the landlord, if the rent is to be paid
    through a bank;
    (f) the purpose for which the premises is let out; and
    (g) amount of advance rent, security or pagri, if any.
    (2) If the tenure of the tenancy is fixed but a rent is fixed only for a part of
    the tenure, in the absence of any stipulation to the contrary in the tenancy
    agreement, the rent shall be deemed to remain the same for the whole of the tenure.
  text_sha256: 65bf6b5ffe03ebb0fd03566763b98a31ecf7187de27ef35807c3dd68c6211bea
- statute: Punjab Rented Premises Act 2009
  section: '7'
  heading: Payment of rent
  source: punjab_rented_premises_act_2009
  pages:
  - 5
  text: |-
    7. Payment of rent.– (1) A tenant shall pay or tender the rent to the landlord in the
    mode and by the date mentioned in the tenancy agreement.
    (2) If the date of payment is not mentioned in the tenancy agreement, a
    tenant shall pay or tender the rent not later than tenth day of the following month.
    (3) If the mode of payment is not mentioned in the tenancy agreement, a
    tenant shall pay or tender the rent to the landlord through money order or deposit in
    the bank account of the landlord.
  text_sha256: 10b2032a7af11467f817bbbea301bf9b518f69a2fd81af190646aa1803accac4
- statute: Registration Act 1908
  section: 17(1)
  heading: Documents of which registration is compulsory
  source: punjab_registration_act_1908
  pages:
  - 13
  - 14
  text: |-
    17. Documents of which registration is compulsory.– (1) The following
    documents shall be registered, if the property to which they relate is situate in a
    district in which, and if they have been executed on or after the date on which, Act
    No. XVI of 1864, or the Indian Registration Act, 18667, or the Indian Registration Act,
    18718 or the Indian Registration Act, 18779, or this Act came or comes into force,
    namely:–
    (a) instruments of gift of immoveable property;
    (b) other non-testamentary instruments which purport or operate to create,
    declare, assign, limit or extinguish, whether in present or in future, any
    right, title or interest, whether vested or contingent, of the value of one
    hundred rupees and upwards, to or in immoveable property;
    1[Explanation.– In the case of an assignment of a mortgage the consideration for the
    deed of assignment shall be deemed to be the value for registration;]
    2[(bb) an instrument which grants power to an attorney or which constitutes an
    agreement to create, declare, assign, limit or extinguish, by way of sale,
    any right, title or interest of the value of one hundred rupees and upwards,
    to or in immovable property;]
    (c) non-testamentary instruments 3[other than the acknowledgement of a
    receipt or payment made in respect of any transaction to which an
    instrument registered under 4[clause (b)] relates] which acknowledge the
    receipt or payment of any consideration on account of the creation,
    declaration, assignment, limitation or extinction of any such right, title or
    interest; and
    (d) leases of immoveable property from year to year, or for any term
    exceeding one year, or reserving a yearly rent;
    5[(e) non-testamentary instruments transferring or assigning any decree or
    order of a Court or any award when such decree or order or award
    purports or operates to create, declare, assign, limit or extinguish, whether
    in present or in future, any right, title or interest, whether vested or
    contingent, of the value of one hundred rupees and upwards to or in
    immoveable property:]
    Provided that the 6[Government] may, by order published in the 7[Official
    Gazette], exempt from the operation of this sub-section any leases executed in any
    district, or part of a district, the terms granted by which do not exceed five years and
    the annual rents reserved by which do not exceed fifty rupees.
  text_sha256: b2188474e91034661d7fb2ad8c0ffd7fabc59a9b0175f856584b37e9cba2ab4e
