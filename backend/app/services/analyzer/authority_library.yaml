- statute: Transfer of Property Act 1882
  section: '107'
  heading: Leases how made
  source: punjab_transfer_of_property_act_1882
  pages:
  - 53
  text: |-
    107. Leases how made.– A lease of immovable property from year to year, or for
    any term exceeding one year, or reserving a yearly rent, can be made only by a
    registered instrument.
    181[All other leases of immovable property may be made either by a registered
    instrument or by oral agreement accompanied by delivery of possession].
    182[Where a lease of immovable property is made by a registered instrument,
    such instrument or, where there are more instruments than one, each such
    instrument shall be executed by both the lessor and the lessee:]
    183[Provided that the 184[Government] may, 185[* * *] from time to time, by
    notification in the 186[official Gazette], direct that leases of immovable property, other
    than leases from year to year, or for any term exceeding one year, or reserving a
    yearly rent, or any class of such leases, may be made by unregistered instrument or
    by oral agreement without delivery of possession.
