- statute: Transfer of Property Act 1882
  section: '1'
  heading: Short title, commencement, extent and exemption
  source: punjab_transfer_of_property_act_1882
  pages:
  - 9
  - 10
  text: |-
    1. Short title, commencement, extent and exemption.– (1) This Act may be
    cited as the Transfer of Property Act, 1882.
    (2) It shall come into force on the first day of July, 1882.
    (3) The Government may, by notification in the official Gazette, extend the
    Act to the whole or any part of the Punjab.
    (4) The Government may, by notification in the official Gazette, exempt
    either retrospectively or prospectively, any part of the Punjab from all or any of
    paragraphs 2 and 3 of section 54, section 59, section 107 and section 123.
    (5) Notwithstanding anything in this section, paragraphs 2 and 3 of section
    54, section 59, section 107 and section 123 shall not extend or be extended to any
    district for the time being excluded from the operation of the Registration Act, 1908
    (XVI of 1908).]
  text_sha256: 68b2b4fda9e8a911e396da4f937deb69e9db960cffc689e84dc184d666ac4706
  notes:
  - page: 9
    marker: '1'
    marker_in_text: false
    text: |-
      For Statement of Objects and Reasons, see Gazette of India, 1877, Pt. V, p.171; for the Preliminary Report of the Select
      Committee, see ibid., 1878, Pt. V, p.48; for the further Report of the Select Committee, see ibid., 1879, Pt. V, p. 106; for the
      third Report of the Select Committee, see ibid., 1881, Pt. V. p.395; for Proceedings in Council, see ibid., 1877, Supplement,
      p.1568; ibid., 1877, Supplement, p.1690; ibid, 1882, Supplement, pp.96 and 169.
      This Act was extended with effect from 1st January 1915, to the Province of Sind, see Bom. R & O.
      Ss. 54, 107 and 123 were extended from 6th May, 1935, to all Municipalities in the Punjab and all notified areas declared
      and notified under s. 241 of the Punjab Municipal Act, 1911, see Punjab Gazette Extraordinary, 1925, p.27.
      S. 54, paras, 2 and 3, and ss. 59, 107 and 123 extend to every cantonment in the Province, see s.287 of the Cantonments
      Act, 1924 (II of 1924); and published in the Gazette of India, Part IV, dated 23.2.1924, pages 3-58.
      It was repealed as to Crown Grants by the Crown Grants Act, 1895 (XV of 1895), and amended in Sind by Sind Act 14 of
      1939, s.2.
      This Act shall be deemed to have been amended in its application to the Province of Sind, see Sind Act XIV of 1939.
      The Act has been extended, in respect of non-agricultural lands, to Baluchistan States Union and the Khairpur State by
      G.G.Os. 4 and 5 of 1953, as amended respectively.
      The Act was and shall be deemed to have been brought into force in Gwadur with effect from the 8th September, 1958, by
      the Gwadur (Application of Central Laws) Ordinance, 1960 (XXXVII of 1960), s.2.
      The Act, as in force in the North-West Frontier Province immediately before the commencement of N.W.F.P. Regulation
      No.2 of 1974, has been applied to the Provincially Administered Tribal Areas of Chitral, Dir, Kalam, Swat and Malakand
      Protected Area by N.W.F.P. Regulation No.2 of 1974, s.3.
      This Act was originally in the Federal ambit, however, the subject on which this law was enacted, has devolved to the
      provinces by virtue of 18th Amendment in the Constitution, hence it was adopted, with amendments, for the province of the
      Punjab by the Transfer of Property (Amendment) Act 2011 (VIII of 2011); and published in the Gazette of Punjab
      (Extraordinary), dated 2.5.2011, pages 38631– 38632.
