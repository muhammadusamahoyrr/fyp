  text: |
    LEGAL NOTICE

    Through Courier

    To,
    Mr. [[NAME:p2|Asif Nawaz Cheema]]
    [[ADDRESS:a1|House No. 3, Street 14, Satellite Town, Gujranwala]]

    Subject: Recovery of Rs. 2,500,000/- against dishonoured cheque

    Sir,

    Under instructions from my client, Mr. [[NAME:p1|Khalid Mehmood Sandhu]] son of [[NAME:p3|Muhammad Bota Sandhu]], resident of [[ADDRESS:a2|Sandhu Farm House, Sialkot Road, Gujranwala]], I serve this notice upon you as follows:

    1. That you, [[NAME:p2|Asif Nawaz Cheema]], issued cheque No. 0081129 drawn on [[NOT:n1|Margalla Bank Limited]], [[NOT:n2|G.T. Road Branch]], from account [[ACCOUNT:b1|0091-0021876-01]], in favour of my client.
    2. That the said cheque was dishonoured on presentation on 2 May 2026.
    3. That you, Mr. [[NAME:p2|Cheema]], are called upon to pay the amount [[DEADLINE:d1|within fifteen (15) days of receipt of this notice]], failing which my client shall initiate proceedings, including a complaint before the [[NOT:n3|Sessions Court Gujranwala]].

    A copy of this notice is retained in my office for record.

    [[NAME:p4|Muhammad Usman Bajwa]]
    Advocate High Court
    [[PHONE:t1|0300-6428817]]

