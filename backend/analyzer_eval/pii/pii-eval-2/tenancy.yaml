    TENANCY AGREEMENT

    This Tenancy Agreement is made and executed at [[NOT:n1|Lahore]] on this 3rd day of March, 2026.

    BETWEEN

    Mr. [[NAME:p1|Tariq Mehmood Butt]] son of [[NAME:p3|Abdul Hameed Butt]], holder of CNIC No. [[CNIC:c1|35202-4418273-5]], resident of [[ADDRESS:a1|House No. 27, Street 9, Block C, Faisal Town, Lahore]] (hereinafter called the "LANDLORD", which expression shall include his heirs, successors and assigns) of the ONE PART;

    AND

    Mr. [[NAME:p2|Usman Ghani]] son of [[NAME:p4|Ghani Rehman]], holder of CNIC No. [[CNIC:c2|35201-9087342-1]], mobile [[PHONE:t1|0321-4470918]] (hereinafter called the "TENANT") of the OTHER PART.

    WHEREAS the said [[NAME:p1|Tariq Mehmood Butt]] is the absolute owner of the premises bearing [[ADDRESS:a2|Flat No. 4-B, Second Floor, Plot 112, Block H, Johar Town, Lahore]] (the "Premises") and has agreed to let out the same to the Tenant on the following terms:

    1. The tenancy shall be for a period of [[DEADLINE:d1|eleven months commencing from 1 April 2026]] and may be renewed with mutual consent.
    2. The monthly rent shall be Rs. 65,000/- (Rupees Sixty Five Thousand only) payable [[DEADLINE:d2|on or before the 5th of each English calendar month]] into the account of Mr. [[NAME:p1|Butt]], IBAN [[ACCOUNT:b1|PK31MRGB0004410982736152]], maintained with [[NOT:n2|Margalla Bank Limited]], [[NOT:n3|Model Town Branch]].
    3. The Tenant has paid a security deposit of Rs. 130,000/- which shall be refunded [[DEADLINE:d3|within 30 days of the Premises being vacated]], after adjustment of outstanding utility bills.
    4. [[NAME:p2|Usman]] shall not sublet the Premises or any part thereof.
    5. Either party may terminate this agreement by giving [[DEADLINE:d4|two months' prior written notice]].
    6. The Landlord shall bear the property tax; the Tenant shall pay electricity, gas and water charges as per meters.

    IN WITNESS WHEREOF the parties have signed this deed in the presence of the witnesses below.

    LANDLORD: ____________ ([[NAME:p1|Tariq Mehmood Butt]])
    TENANT: ____________ ([[NAME:p2|Usman Ghani]])

    WITNESSES:
    1. [[NAME:p5|Naveed Akhtar]], CNIC [[CNIC:c3|35202-1173645-9]]
    2. [[NAME:p6|Saima Khalid]], CNIC [[CNIC:c4|35202-6620194-4]]

