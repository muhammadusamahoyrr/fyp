    Under instructions from my client Mr. [[NAME:p1|Junaid Iqbal Toor]], resident of [[ADDRESS:a2|House 210, Block J, Model Town Extension, Lahore]], I serve you with this notice.

    1. My client paid you Rs. 2,500,000 for a plot in [[NOT:n2|Paragon City]] on 4 January 2025.
    2. You promised possession by 31 December 2025 but have failed to deliver it.
