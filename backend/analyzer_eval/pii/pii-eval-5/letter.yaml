    LEGAL NOTICE
    (Under Section 12 of the Punjab Rented Premises Act, 2009)

    Through Registered Post A.D. / Courier

    To,
    [[NAME:p2|Shakeel Ahmed Rana]]
    [[ADDRESS:a1|Portion of [[NAME:p1|Fozia Nasir]], House 66-E, Street 10, Model Town Extension, Lahore]]

    Sir,

    Under instructions from and on behalf of my client Mrs. [[NAME:p1|Fozia Nasir]] wife of [[NAME:p3|Nasir Mehmood]], I serve you with this notice:

    1. That my client let out the ground floor portion of her house to you, Mr. [[NAME:p2|Rana]], at a monthly rent of Rs. 55,000.
    2. That you have failed to pay the rent for the last four months, amounting to Rs. 220,000.
    3. That the said [[NAME:p2|Shakeel]] has also damaged the kitchen fittings.

    You are therefore called upon to pay the arrears [[DEADLINE:d1|within fifteen (15) days of receipt of this notice]] and to vacate the premises [[DEADLINE:d2|by 30 April 2026]], failing which my client shall file an ejectment petition and a suit for recovery, at your risk as to costs.

    Copy kept in office for record.

    [[NAME:p4|Ahmad Bilal Warraich]]
    Advocate High Court
    [[NOT:n1|Warraich & Warraich Advocates]], [[ADDRESS:a2|Room 8, Al-Rehman Chambers, Fane Road, Lahore]]
    [[PHONE:t1|042-5557-3301]], [[EMAIL:e1|abwarraich.law@example.pk]]
