    RENT AGREEMENT

    This Rent Agreement is executed at [[NOT:n1|Lahore]] on this 2nd day of February, 2026.

    BETWEEN

    [[NAME:p1|Muhammad Arshad Javed]] son of [[NAME:p3|Javed Iqbal]], holder of CNIC No. [[CNIC:c1|35202-5550418-3]], resident of [[ADDRESS:a1|House No. 112, Street 9, Block F, Faisal Town, Lahore]] (hereinafter called the "LANDLORD", which expression shall include his heirs, successors and assigns) of the ONE PART;

    AND

    [[NAME:p2|Kamran Siddique]] son of [[NAME:p4|Abdul Ghafoor Siddique]], holder of CNIC No. [[CNIC:c2|35201-5551276-9]], presently residing at [[ADDRESS:a2|Flat 3-C, Al-Noor Heights, Main Boulevard, Johar Town, Lahore]] (hereinafter called the "TENANT") of the OTHER PART.

    WHEREAS the Landlord is the lawful owner of the upper portion of [[ADDRESS:a3|House No. 47-B, Street 2, Block D, Wapda Town, Lahore]] (the "Premises") and the Tenant has approached Mr. [[NAME:p1|Arshad]] for renting the same.

    NOW THIS AGREEMENT WITNESSETH AS UNDER:

    1. The tenancy shall be for a period of [[DEADLINE:d1|eleven (11) months commencing from 1 March 2026]] and may be renewed by mutual consent in writing.
    2. The monthly rent is Rs. 65,000/- (Rupees Sixty Five Thousand only), payable in advance [[DEADLINE:d2|on or before the 5th day of every calendar month]].
    3. The Tenant has paid a security deposit of Rs. 130,000/- which shall be refunded by the Landlord [[DEADLINE:d3|within thirty (30) days of the Tenant vacating the Premises]], after deduction of unpaid utility bills, if any.
    4. Rent shall be enhanced by 10% upon renewal.
    5. Either party may terminate this agreement by giving [[DEADLINE:d4|one month's prior notice in writing]].
    6. The said [[NAME:p2|Kamran]] shall not sublet the Premises or any part thereof, nor use it for any commercial purpose.
    7. Mr. [[NAME:p2|Siddique]] shall pay electricity, gas and water charges according to the meters installed.

    IN WITNESS WHEREOF the parties have signed this agreement at [[NOT:n1|Lahore]] on the date first written above.

    LANDLORD                                  TENANT
    [[NAME:p1|Arshad Javed]]                              [[NAME:p2|Kamran Siddique]]

    WITNESSES:
    1. [[NAME:p5|Tariq Mehmood]], CNIC [[CNIC:c3|35202-5559031-1]]
    2. [[NAME:p6|Nadeem Akhtar]], CNIC [[CNIC:c4|35201-5554410-5]]
