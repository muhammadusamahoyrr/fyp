    TENANCY AGREEMENT

    This Tenancy Agreement is made at [[NOT:n1|Lahore]] on this 2nd day of March 2026 BETWEEN:

    [[NAME:p1|Tariq Mehmood Butt]] s/o [[NAME:p3|Ghulam Nabi Butt]], holding CNIC No. [[CNIC:c1|35202-4418273-5]], resident of [[ADDRESS:a1|House No. 47-B, Block J, Johar Town, Lahore]] (hereinafter called the "LANDLORD", which expression shall include his heirs and assigns) of the ONE PART;

    AND

    [[NAME:p2|Saima Iftikhar]] w/o [[NAME:p4|Iftikhar Ahmed Qureshi]], holding CNIC No. [[CNIC:c2|35201-9930461-8]], presently residing at [[ADDRESS:a2|Flat 3, Second Floor, Rehman Plaza, Ferozepur Road, Lahore]] (hereinafter called the "TENANT") of the OTHER PART.

    WHEREAS the Landlord is the lawful owner in possession of the upper portion of the house of [[ADDRESS:a3|[[NAME:p1|Tariq Mehmood Butt]], 112-C, Shadman II, Lahore]] (the "Premises") and has agreed to let the same to the Tenant on the following terms:

    1. The tenancy shall be for a period of [[DEADLINE:d1|eleven (11) months commencing from 1 April 2026]] and may be renewed by mutual consent.
    2. The monthly rent shall be Rs. 85,000/- (Rupees Eighty-Five Thousand only), payable in advance [[DEADLINE:d2|on or before the 5th day of each calendar month]].
    3. The Tenant has paid a security deposit of Rs. 170,000/- which shall be refunded, without interest, [[DEADLINE:d3|within thirty (30) days of the Premises being vacated]], after adjusting any dues.
    4. Either party may terminate this tenancy by giving the other [[DEADLINE:d4|two (2) months' prior written notice]].
    5. Mr. [[NAME:p1|Butt]] shall pay the property tax. Mrs. [[NAME:p2|Saima]] shall pay the electricity, gas and water bills for the period of her occupation.
    6. The Tenant shall not sublet the Premises or any part of it. The said [[NAME:p2|Saima Iftikhar]] shall use the Premises for residence only.
    7. Any dispute shall be subject to the exclusive jurisdiction of the courts at [[NOT:n2|Lahore]].

    IN WITNESS WHEREOF the parties have signed this agreement on the date first written above.

    LANDLORD: ____________________  [[NAME:p1|Tariq M. Butt]]
    TENANT:   ____________________  [[NAME:p2|Saima Iftikhar]]

    WITNESSES:
    1. [[NAME:p5|Naveed Akhtar]], CNIC [[CNIC:c3|35202-1176930-1]]
    2. [[NAME:p6|Rubina Kausar]], CNIC [[CNIC:c4|35202-8820417-4]]
