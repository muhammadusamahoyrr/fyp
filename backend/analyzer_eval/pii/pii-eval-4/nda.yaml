    MUTUAL NON-DISCLOSURE AGREEMENT

    This Mutual Non-Disclosure Agreement (the "Agreement") is entered into on 12 January 2026 by and between:

    (1) [[NOT:n1|Indus Valley Agritech (Private) Limited]], a company incorporated under the Companies Act, 2017, having its registered office at [[ADDRESS:a1|17-C, Main Gulberg Boulevard, Gulberg III, Lahore]], acting through its Chief Executive, [[NAME:p1|Omer Farooq Malik]] ("IVA"); and

    (2) [[NOT:n2|Seraj Cold Chain Solutions]], a partnership firm having its place of business at [[ADDRESS:a2|Plot 9-A, Sector 23, Korangi Industrial Area, Karachi]], acting through its managing partner, [[NAME:p2|Nadia Sultan Hashmi]] ("Seraj").

    1. Purpose. The parties wish to evaluate a joint cold-storage project for citrus exports (the "[[NOT:n3|Kinnow Corridor Project]]") and will exchange Confidential Information for that purpose only.
    2. Obligations. Each party shall keep the other's Confidential Information secret [[DEADLINE:d1|for a period of three (3) years from the date of this Agreement]].
    3. Return of material. On written request, the receiving party shall return or destroy all Confidential Information [[DEADLINE:d2|within ten (10) business days]].
    4. Notices. Notices to IVA shall be addressed to Mr. [[NAME:p1|Malik]] at [[EMAIL:e1|omer.malik@indusvalleyagri.com.pk]]; notices to Seraj shall be addressed to Ms. [[NAME:p2|Hashmi]] at [[EMAIL:e2|nadia@serajcoldchain.pk]].
    5. Governing law. This Agreement is governed by the laws of [[NOT:n4|Pakistan]] and the courts at [[NOT:n5|Lahore]] shall have jurisdiction.
    6. Term. Either party may end discussions by [[DEADLINE:d3|fifteen (15) days' written notice]], but clause 2 shall survive.

    For and on behalf of IVA: [[NAME:p1|Omer Farooq Malik]], Chief Executive
    For and on behalf of Seraj: [[NAME:p2|Nadia Sultan Hashmi]], Managing Partner
    Witness: [[NAME:p3|Hammad Ul Haq]]
