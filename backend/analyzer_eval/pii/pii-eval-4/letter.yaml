  text: |
    LEGAL NOTICE

    Through Registered A.D. and Courier

    To,
    Mr. [[NAME:p2|Kaleem Ullah Niazi]]
    [[ADDRESS:a1|Flat 8, Second Floor, Iqbal Mansion, 41-Davis Road, Lahore]]

    Subject: Notice for payment of arrears of rent and vacation of premises

    Sir,

    Under instructions from and on behalf of my client, [[NAME:p1|Shaista Perveen Gondal]] w/o [[NAME:p3|Javed Iqbal Gondal]], resident of [[ADDRESS:a2|the house of [[NAME:p3|Javed Iqbal Gondal]], 5-Tufail Road, Lahore Cantt]], I serve you with this notice as follows:

    1. That my client let out the above flat to you under a tenancy agreement dated 1 November 2024 at a monthly rent of Rs. 70,000.
    2. That you, [[NAME:p2|Kaleem Ullah Niazi]], have failed to pay rent for the months of March to July 2026, amounting to Rs. 350,000.
    3. That my client's repeated requests to Mr. [[NAME:p2|Niazi]] have been ignored.

    You are therefore called upon to pay the arrears [[DEADLINE:d1|within fifteen (15) days of receipt of this notice]] and to vacate the flat [[DEADLINE:d2|by 30 September 2026]], failing which my client shall file an eviction petition before the Rent Controller, [[NOT:n1|Lahore]], at your risk as to costs.

    A copy of this notice is retained in my office for record.

    [[NAME:p4|Saqib Javed Warraich]]
    Advocate High Court
    [[ADDRESS:a3|Chamber No. 14, Lahore High Court Bar, Lahore]]
    [[PHONE:t1|0321-8814032]]
