    PRIVATE AND CONFIDENTIAL

    [[NAME:p2|Zainab Hamid Bhatti]]
    [[ADDRESS:a1|House 4, Block K, Phase 2, Hayatabad, Peshawar]]

    Dear [[NAME:p2|Zainab]],

    Breach of confidentiality undertaking dated 2 January 2026

    We act for [[NAME:p1|Shahrukh Javed Qureshi]], owner of [[NOT:n1|Qureshi Herbal Remedies]]. Our client has learned that the formulation of the product "[[NOT:n2|Shifa Plus]]" was shared with a competitor, [[NOT:n3|Gandhara Naturals]], after you left his employment.

    The relevant events are:

    | Date | Event |
    |---|---|
    | 2 January 2026 | Ms. [[NAME:p2|Bhatti]] signs the undertaking |
    | 30 April 2026 | Employment of [[NAME:p2|Z. H. Bhatti]] ends |
    | 12 June 2026 | [[NOT:n4|Gandhara Naturals]] launches a similar product |

    Mr. [[NAME:p1|Qureshi]] requires you to (i) confirm in writing [[DEADLINE:d1|within 7 days]] that you hold no copies of the formulation; and (ii) refrain from any further disclosure. If we do not hear from you [[DEADLINE:d2|by 25 September 2026]], our client will sue for damages and an injunction.

    [[NAME:p3|Kamran Afzal]]
    Advocate, for [[NAME:p1|Shahrukh J. Qureshi]]
