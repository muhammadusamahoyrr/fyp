    MUTUAL NON-DISCLOSURE AGREEMENT

    This Mutual Non-Disclosure Agreement (the "Agreement") is made on 9 September 2026 between:

    (1) [[NOT:n1|Indus Loom Textiles (Private) Limited]], a company incorporated under the Companies Act, 2017, represented by [[NAME:p1|Asad Mehmood Butt]], [[NOT:n2|Chief Executive Officer]]; and
    (2) [[NOT:n3|Margalla Analytics (SMC-Private) Limited]], represented by [[NAME:p2|Nida Fatima Rizvi]], [[NOT:n4|Director]].

    Purpose: evaluating a possible engagement for [[NOT:n5|Project Sutlej]], an automated yarn-grading system.

    1. Confidential Information means all information disclosed by either party in connection with the Purpose, whether oral, written or electronic.
    2. The receiving party shall use Confidential Information only for the Purpose and shall disclose it only to employees who need to know it.
    3. The obligations in this Agreement continue [[DEADLINE:d1|for three (3) years from the date of each disclosure]].
    4. On written request, the receiving party shall return or destroy all Confidential Information [[DEADLINE:d2|within ten (10) business days]].
    5. This Agreement terminates automatically if no definitive agreement is signed [[DEADLINE:d3|by 31 December 2026]], but clause 3 shall survive.
    6. Contact persons: [[NAME:p1|Asad Mehmood Butt]] for the first party and [[NAME:p2|Nida Fatima Rizvi]] for the second party.

    For [[NOT:n6|Indus Loom Textiles]]: [[NAME:p1|Asad Mehmood Butt]]
    For [[NOT:n7|Margalla Analytics]]: [[NAME:p2|Nida Fatima Rizvi]]
