    To
    The SHO,
    [[NOT:n1|Police Station Gulshan-e-Maymar]],
    [[NOT:n2|Karachi]]

    Subject: Complaint against obstruction of passage

    Respected Sir,

    I, [[NAME:p1|Shakeel Ahmed Qaimkhani]], resident of [[ADDRESS:a1|House No. R-219, Sector X-4, Gulshan-e-Maymar, Karachi]], CNIC [[CNIC:c1|42401-1938450-7]], beg to state that my neighbour [[NAME:p2|Javed Iqbal Baloch]] has built a boundary wall that blocks the common street between our houses.

    The street runs from my gate up to [[ADDRESS:a2|the plot of Mst. [[NAME:p3|Zubaida Khatoon]], House No. R-221, Sector X-4, Gulshan-e-Maymar, Karachi]], who is an elderly widow and is also affected.

    I asked Mr. [[NAME:p2|Baloch]] politely on several occasions, but [[NAME:p2|Javed]] Sahib refused and threatened me. The said [[NAME:p2|Javed Iqbal]] has also parked his trucks of [[NOT:n3|Baloch Goods Transport]] in the street.

    It is requested that the wall be removed and action be taken according to law.

    Yours obediently,
    [[NAME:p1|Shakeel Ahmed]]
    Cell: [[PHONE:ph1|0302-2146608]]
