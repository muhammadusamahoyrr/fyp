    TENANCY AGREEMENT

    This Tenancy Agreement is made and executed at [[NOT:n1|Lahore]] on this 3rd day of March, 2026.

    BETWEEN

    [[NAME:p1|Rana Tahir Mehmood]] son of [[NAME:p3|Rana Abdul Ghafoor]], holder of CNIC No. [[CNIC:c1|35201-4417902-3]], resident of [[ADDRESS:a1|House No. 27, Street No. 9, Faisal Town Extension, Lahore]] (hereinafter called the "LANDLORD", which expression shall include his heirs, successors and assigns) of the ONE PART;

    AND

    [[NAME:p2|Saima Naureen]] wife of [[NAME:p4|Adeel Javed]], holder of CNIC No. [[CNIC:c2|35202-8830164-6]], mobile No. [[PHONE:ph1|0321-4478120]] (hereinafter called the "TENANT") of the OTHER PART.

    WHEREAS the Landlord is the absolute owner of the Upper Portion of [[ADDRESS:a2|House No. 112-B, Block C, Gulshan-e-Ravi, Lahore]] (the "said premises") and the Tenant has approached him to take the said premises on rent.

    NOW THIS AGREEMENT WITNESSETH AS UNDER:

    1. That the tenancy shall be for a period of [[DEADLINE:d1|eleven (11) months commencing from 1st April 2026]] and may be renewed with mutual consent.
    2. That the monthly rent of Rs. 45,000/- (Rupees Forty Five Thousand only) shall be paid in advance [[DEADLINE:d2|on or before the 5th day of each calendar month]].
    3. That Mrs. [[NAME:p2|Naureen]] has paid a security deposit of Rs. 90,000/- to Mr. [[NAME:p1|Mehmood]], which shall be refunded [[DEADLINE:d3|within thirty (30) days of the vacation of the said premises]] after adjustment of any dues.
    4. That the Tenant shall pay the bills of [[NOT:n2|Ravi Electric Supply Company]] and [[NOT:n3|Northern Gas Utility]] regularly and shall produce paid bills to the said [[NAME:p1|Tahir]] whenever asked.
    5. That the said [[NAME:p2|Saima]] shall not sub-let the said premises or any part thereof.
    6. That either party may terminate this agreement by giving [[DEADLINE:d4|two months' prior notice in writing]].
    7. That the rent shall be enhanced by 10% upon renewal.

    IN WITNESS WHEREOF the parties have signed this agreement in the presence of the witnesses.

    LANDLORD: ____________ [[NAME:p1|Rana Tahir Mehmood]]
    TENANT: ____________ [[NAME:p2|Saima Naureen]]

