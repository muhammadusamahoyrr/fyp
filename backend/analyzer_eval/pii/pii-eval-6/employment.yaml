    [[NOT:n1|RAVI PHARMACEUTICALS (PVT.) LIMITED]]
    Human Resources Department

    Ref: RPL/HR/2026/0417
    Date: 11 August 2026

    Mr. [[NAME:p2|Danish Saleem Awan]]
    [[ADDRESS:a1|House No. 8, Street 21, Chaklala Scheme III, Rawalpindi]]

    Subject: OFFER OF EMPLOYMENT - [[NOT:n2|ASSISTANT MANAGER QUALITY CONTROL]]

    Dear Mr. [[NAME:p2|Awan]],

    Further to your interview held on 4 August 2026, we are pleased to offer you the position of Assistant Manager Quality Control at our plant on [[NOT:n3|Kahuta Road]], on the following terms:

    1. Gross salary: Rs. 285,000 per month.
    2. Probation: [[DEADLINE:d1|six (6) months from the date of joining]], extendable once by [[DEADLINE:d2|three months]].
    3. Joining date: on or before [[DEADLINE:d3|1 September 2026]].
    4. Notice period after confirmation: [[DEADLINE:d4|one (1) month]] or salary in lieu thereof.
    5. You will report to Dr. [[NAME:p3|Fahad Mansoor]], [[NOT:n4|Plant Manager]].

    Please sign and return the duplicate copy of this letter [[DEADLINE:d5|within seven (7) days]] as a token of your acceptance, failing which this offer shall lapse. [[NAME:p2|Danish]], we look forward to welcoming you to the team.

    Yours sincerely,

    [[NAME:p1|Lubna Farooqi]]
    [[NOT:n5|Head of Human Resources]]
    [[EMAIL:e1|lubna.farooqi@example.pk]]
