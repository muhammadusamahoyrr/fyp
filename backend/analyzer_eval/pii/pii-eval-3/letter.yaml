  text: |
    LEGAL NOTICE

    Through Registered A.D. and Courier

    To,
    Mr. [[NAME:p2|Shafqat Ali Jutt]]
    [[ADDRESS:a1|Upper Portion, House of [[NAME:p3|Sardar Begum]], 19-C, Street 7, Samanabad, Lahore]]

    Subject: Notice for payment of arrears of rent and vacation of premises

    Sir,

    Under instructions from my client [[NAME:p1|Nighat Sultana]] widow of [[NAME:p4|Muhammad Saleem]],
    resident of [[ADDRESS:a2|House 4, Street 2, Poonch Road, Samanabad, Lahore]], I serve upon you the following notice:

    1. That my client let out the above premises to you under a tenancy agreement dated 1 March 2025.
    2. That you, the said [[NAME:p2|Shafqat]], have not paid the rent for June, July and August 2026, amounting to Rs. 156,000.
    3. That my client's mother-in-law, [[NAME:p3|Sardar Begum]], who lives on the ground floor, has also complained
       of your conduct.

    You are hereby called upon to pay the arrears [[DEADLINE:d1|within fifteen (15) days of receipt of this notice]]
    and to vacate the premises [[DEADLINE:d2|by 31 October 2026]], failing which my client shall file an ejectment
    petition before the [[NOT:n1|Rent Tribunal, Lahore]] at your risk as to costs.

    A copy of this notice is retained in my office for record.

    [[NAME:p5|Asif Mehmood Chattha]]
    Advocate High Court
    [[NOT:n2|Chattha Law Associates]], [[NOT:n3|Lahore]]
    Cell: [[PHONE:t1|0300-4019287]]

    cc: Mrs. [[NAME:p1|Nighat Sultana]]

