    Date: 28 August 2026

    To: [[NAME:p2|Yasir Hameed]]
    [[ADDRESS:a1|c/o [[NAME:p3|Hameed Akhtar]], House 230, Block D, Wapda Town Phase 1, Multan]]
    Email: [[EMAIL:e1|yasir.hameed.dev@example.com]]

    Dear [[NAME:p2|Yasir]],

    It has come to our notice that screenshots of the [[NOT:n1|Kisan Dost]] app dashboard, which you
    accessed under the non-disclosure agreement signed on 2 February 2026, were posted in a public group.
    This is a breach of clause 3 of that agreement.

    You are required to:
    (a) remove all posted material [[DEADLINE:d1|within 24 hours of this notice]];
    (b) confirm in writing [[DEADLINE:d2|by 2 September 2026]] that you hold no other copies; and
    (c) attend a meeting at our [[NOT:n2|Multan]] office [[DEADLINE:d3|within the next seven days]].

