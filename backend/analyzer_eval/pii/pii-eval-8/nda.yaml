    [[NOT:n1|MUTUAL NON-DISCLOSURE AGREEMENT]]

    This Agreement is entered into on 12 August 2026 between:

    [[NOT:n2|Karakoram Agritech (Private) Limited]], a company incorporated in Pakistan, acting through its
    [[NOT:n3|Chief Executive Officer]], [[NAME:p1|Haroon Saleem Abbasi]] ("Company A"); and

    [[NOT:n4|Chenab Solar Works (Pvt.) Ltd.]], acting through its director, [[NAME:p2|Lubna Shaheen Akhtar]]
    ("Company B").

    1. PURPOSE
       The parties wish to discuss a joint bid for [[NOT:n5|Project Sabz Tubewell]] (the "Purpose").

    2. CONFIDENTIAL INFORMATION
       Confidential Information means all technical, commercial and financial information disclosed
       by one party to the other in connection with the Purpose, whether oral or written.

    3. OBLIGATIONS
       Each party shall keep the other's Confidential Information secret and use it only for the
       Purpose. Disclosure to employees is allowed only on a need-to-know basis.

    4. RETURN OF INFORMATION
       Each party shall return or destroy the other's Confidential Information
       [[DEADLINE:d1|within 14 days of a written request]].

    5. TERM
       This Agreement remains in force for [[DEADLINE:d2|three years from the date of signing]], and the
       obligations of confidentiality survive for [[DEADLINE:d3|two years after termination]].

    6. NOTICES
       Notices to Company A go to Mr. [[NAME:p1|Abbasi]] at [[EMAIL:e1|h.abbasi@karakoram-agri.example.com]].
       Notices to Company B go to Ms. [[NAME:p2|Akhtar]] at [[EMAIL:e2|lubna.akhtar@chenabsolar.example.org]].

    7. NO LICENCE
       Nothing in this Agreement grants a licence under any patent, trade mark or copyright.

    8. REMEDIES
       A breach may cause irreparable harm, and the injured party may seek an injunction in
       addition to damages.

    9. GOVERNING LAW
       This Agreement is governed by the laws of Pakistan. The courts at [[NOT:n6|Islamabad]] have
       exclusive jurisdiction.

    10. ENTIRE AGREEMENT
       This is the entire agreement on its subject and may be changed only in writing.

    For Company A                              For Company B
    [[NAME:p1|Haroon Saleem Abbasi]]                  [[NAME:p2|Lubna Shaheen Akhtar]]

    Witnessed by [[NAME:p3|Kiran Zafar]] and [[NAME:p4|Danish Mukhtar]].
