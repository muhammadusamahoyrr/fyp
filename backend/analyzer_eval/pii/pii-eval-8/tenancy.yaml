  text: |
    [[NOT:n1|DEED OF LEASE]]

    This Deed is made on 3 August 2026 BETWEEN:

    [[NAME:p1|Kamran Aslam Bhatti]] son of [[NAME:p3|Muhammad Aslam Bhatti]], holding CNIC No. [[CNIC:c1|35201-4471932-5]],
    resident of [[ADDRESS:a1|House No. 27, Street 9, Faisal Block, Shadman Colony, Lahore]]
    (hereinafter called the "Lessor") of the ONE PART;

    AND

    [[NAME:p2|Sana Iftikhar]] daughter of [[NAME:p4|Iftikhar Hussain]], holding CNIC No. [[CNIC:c2|35202-8810457-2]],
    resident of [[ADDRESS:a2|Flat 6-B, Al-Noor Heights, Canal Road, Faisalabad]]
    (hereinafter called the "Lessee") of the OTHER PART.

    WHEREAS the Lessor is the owner of the premises situated at
    [[ADDRESS:a3|Shop No. 4, Ground Floor, Bilal Arcade, Main Boulevard, Lahore]]
    (hereinafter called the "Premises"), presently used as a showroom by [[NOT:n2|Zarnab Fabrics (Pvt.) Ltd.]];

    AND WHEREAS the Lessee wishes to take the Premises on lease for running a boutique.

    NOW THIS DEED WITNESSETH AS FOLLOWS:

    1. The Lessor lets and the Lessee takes the Premises for a term of
       [[DEADLINE:d1|eleven months from 1 September 2026]].
    2. The monthly rent is Rs. 85,000, payable in advance [[DEADLINE:d2|by the 5th day of each calendar month]].
    3. Mr. [[NAME:p1|Bhatti]] shall hand over vacant possession [[DEADLINE:d3|on or before 31 August 2026]].
    4. The security deposit of Rs. 170,000 shall be refunded by [[NAME:p1|Kamran]] to the Lessee
       [[DEADLINE:d4|within 30 days of the end of the term]], after deduction of unpaid utility bills.
    5. The said [[NAME:p2|Sana]] shall not sublet the Premises or any part of it without the written
       consent of the Lessor.
    6. Either party may terminate this lease by giving [[DEADLINE:d5|two months' written notice]].
    7. Any notice to the Lessee shall be sent to Ms. [[NAME:p2|Iftikhar]] at the address above or by email to
       [[EMAIL:e1|sana.iftikhar88@example.com]]; notice to the Lessor on [[PHONE:t1|0321-7730418]].
    8. The Lessee shall pay the electricity and gas bills of the Premises during the term.
    9. The Lessor shall pay the property tax and shall carry out structural repairs.
    10. The Lessee shall not make any structural alteration without written approval.
    11. This lease shall be governed by the laws of Pakistan and the courts at [[NOT:n3|Lahore]] shall
        have jurisdiction.

    IN WITNESS WHEREOF the parties have signed this Deed on the date first written above.

    LESSOR                                   LESSEE
    [[NAME:p1|Kamran Aslam Bhatti]]                      [[NAME:p2|Sana Iftikhar]]

    WITNESSES:
    1. [[NAME:p5|Usman Ghani Cheema]], CNIC [[CNIC:c3|35202-6619084-7]]
    2. [[NAME:p6|Rabia Noreen]], CNIC [[CNIC:c4|34101-2287365-4]]
