  text: |
    TENANCY AGREEMENT - RESIDENTIAL HOUSE

    THIS AGREEMENT is executed on 20 September 2026 between:

    (1) [[NAME:p1|Imran Yousaf Butt]] ([[NAME:p1|عمران یوسف بٹ]]), CNIC [[CNIC:c1|34603-5520918-9]],
        resident of [[ADDRESS:a1|House 9, Street 2, Model Town Extension, Sialkot]] ("Landlord"); and

    (2) [[NAME:p2|Hina Pervaiz]] ([[NAME:p2|حنا پرویز]]), CNIC [[CNIC:c2|34601-7713025-2]],
        presently residing at [[ADDRESS:a2|Upper Portion, House of [[NAME:p3|Pervaiz Akhtar]], Kashmir Road, Sialkot]] ("Tenant").

    The Landlord agrees to let the house at [[ADDRESS:a3|House 31-B, Paris Road, Sialkot Cantt]] to the Tenant
    on the following terms.

    PART A - TERM AND RENT
    1. Term: [[DEADLINE:d1|eleven months from 1 October 2026]], renewable by mutual consent.
    2. Rent: Rs. 60,000 per month, payable [[DEADLINE:d2|in advance by the 5th of each month]].
    3. Advance: Rs. 180,000, refundable [[DEADLINE:d3|within one month of the Tenant vacating]].

    PART B - USE OF PREMISES
    4. The house shall be used for residence only and not for any business such as
       [[NOT:n1|Hina Beauty Parlour]] or a tuition centre.
    5. The Tenant shall not keep more than two vehicles in the porch.
    6. Mr. [[NAME:p1|Butt]] may inspect the house once a month after giving a day's notice.

    PART C - REPAIRS
    7. Day-to-day repairs are the responsibility of the Tenant.
    8. Major repairs to the roof, plumbing and wiring shall be done by the Landlord
       [[DEADLINE:d4|within 14 days of being informed]].
    9. The said [[NAME:p1|Imran]] will service the air conditioners before summer.

    PART D - TERMINATION
    10. Either party may end this agreement with [[DEADLINE:d5|one month's written notice]].
    11. If [[NAME:p2|Hina]] leaves early without notice, one month's rent shall be deducted from the advance.
    12. On expiry the Tenant shall hand back all keys and the gate remote.

    PART E - GENERAL
    13. Disputes shall first be referred to [[NOT:n2|Sialkot Chamber of Commerce]] mediation.
    14. This agreement is made in two copies, one for each party.

    LANDLORD                                   TENANT
    [[NAME:p1|Imran Yousaf Butt]]                      [[NAME:p2|Hina Pervaiz]]
    [[NAME:p1|عمران یوسف بٹ]]                     [[NAME:p2|حنا پرویز]]

    Witness 1: [[NAME:p4|Zeeshan Haider]], Mobile [[PHONE:t1|0300-6145823]]
    Witness 2: [[NAME:p5|Asma Rauf]], Mobile [[PHONE:t2|0321-8836104]]
