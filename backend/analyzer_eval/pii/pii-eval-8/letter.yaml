  text: |
    LEGAL NOTICE

    [[NOT:n1|Mirza and Haq Advocates]]

    Date: 28 September 2026

    To:
    [[NAME:p2|Javed Akbar Sipra]]
    [[ADDRESS:a1|House 70, Street 3, Officers Colony, Multan]]

    Subject: Recovery of Rs. 1,450,000 owed to our client

    Dear Sir,

    We act for our client [[NAME:p1|Nabeel Hassan Gardezi]], resident of
    [[ADDRESS:a2|Haveli of [[NAME:p3|Hassan Raza Gardezi]], Mohalla Pak Gate, Multan]].

    1. On 2 January 2026 you borrowed Rs. 1,450,000 from our client and promised to repay it by
       30 June 2026. A cheque issued by you was dishonoured on 3 July 2026.

    2. Our client has repeatedly asked Mr. [[NAME:p2|Sipra]] to pay. Despite this, you have not paid a
       single rupee.

    3. You are hereby called upon to pay the full amount [[DEADLINE:d1|within 15 days of receipt of this notice]],
       failing which our client will file a suit for recovery and a criminal complaint without further
       notice.

    4. Any settlement offer may be sent to the undersigned at [[EMAIL:e1|notices@mirzahaq-law.example.com]].
       [[NAME:p1|Nabeel]] is willing to accept payment in two instalments if the first is paid
       [[DEADLINE:d2|by 20 October 2026]].

    5. The said [[NAME:p2|Javed]] is also liable for the costs of this notice, fixed at Rs. 25,000.

    Copy to: [[NAME:p1|Nabeel Hassan Gardezi]] (client)

    Advocate
    [[NAME:p4|Saba Mirza]]
