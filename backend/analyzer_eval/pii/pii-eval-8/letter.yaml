    [[NOT:n1|Tabassum and Co. Chartered Accountants]]

    3 October 2026

    The Visa Section
    [[NOT:n2|Embassy of the Republic of Ostravia]]
    [[NOT:n3|Diplomatic Enclave]], Islamabad

    Subject: Employment and salary confirmation for Mr. [[NAME:p2|Ehtisham Ul Haq Paracha]]

    Dear Sir or Madam,

    We confirm that [[NAME:p2|Ehtisham Ul Haq Paracha]], holder of CNIC [[CNIC:c1|37405-2210984-7]], has
    been employed by our firm since 1 February 2019. He currently holds the position of
    [[NOT:n4|Audit Manager]] in our Rawalpindi office.

    Mr. [[NAME:p2|Paracha]] draws a gross monthly salary of Rs. 465,000. His salary is credited each
    month to his account [[ACCOUNT:b1|PK90QWRT0000117730294415]].

    [[NAME:p2|Ehtisham]] has been granted leave from 1 December 2026 to 21 December 2026 to visit
    his sister [[NAME:p3|Mahnoor Paracha]], who lives in Ostravia. He is required to resume duty
    [[DEADLINE:d1|on 22 December 2026]], and his post will be kept for him until then.

    The said [[NAME:p2|Ehtisham]] has been a reliable member of our staff. During his employment he
    has led the audits of several clients, including [[NOT:n5|Potohar Cement Ltd.]] and
    [[NOT:n6|Kohsar Mineral Water]].

    His residential address on our records is
    [[ADDRESS:a1|House of [[NAME:p4|Inam Ul Haq Paracha]], Street 11, Lalazar, Rawalpindi]].

    Should you require any further information, please contact the undersigned on
    [[PHONE:t1|051-55 60 412]] or [[EMAIL:e1|hr@tabassum-ca.example.com]]. We would be grateful if
    any query could be raised [[DEADLINE:d2|within 14 days of this letter]], as the undersigned will be
    on leave after that.

    We also confirm that:
    - [[NAME:p2|Ehtisham Ul Haq Paracha]] is a permanent employee and is not under notice;
    - no disciplinary proceedings are pending against him;
    - his annual increment is due on 1 February 2027.

    Yours faithfully,

    [[NAME:p1|Shireen Tabassum Malik]]
    Partner
