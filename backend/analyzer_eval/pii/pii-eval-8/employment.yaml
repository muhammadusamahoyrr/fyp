    [[NOT:n1|EMPLOYMENT AGREEMENT]]

    This Agreement is made on 1 September 2026 between [[NOT:n2|Indus Valley Textiles (Pvt.) Ltd.]]
    (the "Employer"), represented by its HR Director [[NAME:p1|Shabnam Riaz Khawaja]], and
    [[NAME:p2|Arsalan Mujtaba Rizvi]], CNIC [[CNIC:c1|42101-6612083-3]], residing at
    [[ADDRESS:a1|House A-118, Block 7, Gulistan-e-Jauhar, Karachi]] (the "Employee").

    1. POSITION
       The Employee is appointed as [[NOT:n3|Assistant Manager Supply Chain]] at the
       [[NOT:n4|Korangi Spinning Unit]].

    2. COMMENCEMENT AND PROBATION
       Employment starts on 15 September 2026. The first [[DEADLINE:d1|three months from the joining date]]
       are a probation period, during which either party may end employment with
       [[DEADLINE:d2|seven days' notice]].

    3. SALARY
       Gross salary is Rs. 310,000 per month, paid [[DEADLINE:d3|by the 1st working day of the following month]]
       into the Employee's account [[ACCOUNT:b1|PK41QWRT0000781234509966]].

    4. WORKING HOURS
       Monday to Friday, 9 am to 5:30 pm, with Saturday duty when the plant manager requires.

    5. LEAVE
       20 days of annual leave, 10 days of casual leave and 8 days of sick leave per year.

    6. CONFIDENTIALITY
       Mr. [[NAME:p2|Rizvi]] shall keep the Employer's supplier terms confidential during employment and
       [[DEADLINE:d4|for two years after it ends]].

    7. TERMINATION
       After confirmation, either party may terminate this Agreement by giving
       [[DEADLINE:d5|one month's notice in writing]] or one month's salary in lieu.

    8. FINAL SETTLEMENT
       Dues shall be settled [[DEADLINE:d6|within 30 days of the last working day]].

    9. REPORTING
       [[NAME:p2|Arsalan]] will report to [[NAME:p3|Waqar Hussain Shah]], Plant Manager.

    10. GOVERNING LAW
        This Agreement is governed by the laws of Pakistan applicable in [[NOT:n5|Sindh]].

    For the Employer                         Employee
    [[NAME:p1|Shabnam Riaz Khawaja]]                     [[NAME:p2|Arsalan Mujtaba Rizvi]]

    Emergency contact of the said [[NAME:p2|Arsalan]]: [[NAME:p4|Kulsoom Rizvi]], [[PHONE:t1|0300-2587731]]
