    EMPLOYMENT CONTRACT - FIXED TERM

    THIS CONTRACT is made on 5 October 2026.

    BETWEEN [[NOT:n1|Sufi Saeen Rice Exporters]], [[NOT:n2|Larkana]] (the "Employer"), acting through its owner
    [[NAME:p1|Abdul Qadeer Mahar]] ([[NAME:p1|عبدالقدیر مہر]]),

    AND [[NAME:p2|Saira Bano Soomro]] ([[NAME:p2|سائرہ بانو سومرو]]), CNIC [[CNIC:c1|43203-6618092-4]], of
    [[ADDRESS:a1|House of [[NAME:p3|Bano Begum]], Mohalla Bakrani, Ward 6, Larkana City]]
    (the "Employee").

    1. Role. The Employee will work as quality inspector at the rice mill.
    2. Term. [[DEADLINE:d1|Twelve months from 15 October 2026]], ending automatically unless renewed.
    3. Pay. Rs. 55,000 per month, paid [[DEADLINE:d2|by the 7th of the next month]].
    4. Hours. 8 am to 4 pm, six days a week, with Friday prayer break.
    5. Duties.
       (a) Inspect each lot before bagging.
       (b) Keep moisture records for every lot.
       (c) Report defects to [[NAME:p1|Abdul Qadeer Mahar]] on the same day.
    6. Leave. 12 days of paid leave, applied for [[DEADLINE:d3|at least 3 days in advance]].
    7. Safety. [[NAME:p2|Saira]] must wear the mask and gloves provided.
    8. Termination. Either side may end the contract with [[DEADLINE:d4|30 days' notice]].
    9. Final dues. Paid [[DEADLINE:d5|within 15 days of the end of employment]].
    10. Disputes. Referred to the labour court having jurisdiction.

    Employer: [[NAME:p1|عبدالقدیر مہر]]          Employee: [[NAME:p2|سائرہ بانو سومرو]]

    Witnesses: [[NAME:p4|Hyder Bux Chandio]] ([[PHONE:t1|0300-3412098]]), [[NAME:p5|Naseem Akhtar Shaikh]]
