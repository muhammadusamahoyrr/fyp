      MUTUAL NON-DISCLOSURE AGREEMENT

      This Agreement is made on 6 February 2025 at Karachi between Alpha Textile Mills Limited, having its registered office at 14 Korangi Industrial Area, Karachi ("Alpha") and Beacon Software (Private) Limited, 3rd Floor, Tower B, Shahrah-e-Faisal, Karachi ("Beacon").

      1. Purpose. The parties wish to discuss a possible supply of an inventory system and may each disclose confidential material to the other.
      2. Confidential Information means all technical, commercial and financial information, in any form, that one party discloses to the other in connection with the Purpose and that is marked or would reasonably be understood to be confidential.
      3. Each party shall hold the other's Confidential Information in confidence and use it only for the Purpose. These obligations bind both parties equally.
      4. The obligations in this Agreement continue for five years from the date of this Agreement.
      5. Confidential Information does not include information that is or becomes public through no fault of the recipient, was already known to the recipient, or is independently developed or lawfully received from a third party.
      6. On written request, or when discussions end, each party shall return or destroy the other's Confidential Information and confirm in writing that it has done so.
      7. A party that is required by a court or a government authority to disclose Confidential Information may do so after giving the other prompt notice, and only to the extent required.
      8. Any dispute shall be referred to a single arbitrator at Karachi.
      9. This Agreement is governed by the laws of Pakistan.

      For Alpha: ______________________      For Beacon: ______________________
