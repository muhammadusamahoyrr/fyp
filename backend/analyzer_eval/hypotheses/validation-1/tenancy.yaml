      1. The Landlord lets the ground floor of House No. 45, Street 7, Block C, Model Town, Lahore (the "Premises") to the Tenant for residential use.
      2. The tenancy is for a period of eleven months commencing on 1 April 2025.
      3. The monthly rent is Rs. 85,000, payable in advance on or before the 5th day of each calendar month.
      4. The Tenant has deposited Rs. 170,000 as security, which shall be refunded within fifteen days of handing back vacant possession, after deducting any dues.
