      6. The Tenant shall pay the electricity, gas and water bills. The Landlord shall bear structural repairs; minor day-to-day maintenance is the Tenant's responsibility.
      7. On each renewal the rent shall increase by ten percent.
      8. Any dispute arising out of this Agreement shall be referred to arbitration at Lahore under the Arbitration Act, 1940.
      9. This Agreement is governed by the laws of Pakistan.

