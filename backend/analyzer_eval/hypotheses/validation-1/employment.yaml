      4. Notice: After confirmation, either side may end the employment by giving one month's written notice or one month's salary in lieu.
      5. Leave: You are entitled to 14 days casual leave, 8 days sick leave and 20 days annual leave in each calendar year.
      6. Disputes arising from this employment shall be decided by the courts at Lahore.
      7. This letter is governed by the laws of Pakistan.

      Please sign and return the duplicate copy as your acceptance.

      For Zameen Builders (Private) Limited
