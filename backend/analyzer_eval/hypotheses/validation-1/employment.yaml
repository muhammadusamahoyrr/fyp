      Dear Mr. Usman,

      We are pleased to appoint you as Assistant Manager (Accounts) in Zameen Builders (Private) Limited, Lahore, with effect from 1 April 2025.

      1. Salary: Your gross monthly salary will be Rs. 140,000, paid by bank transfer on the last working day of each month.
