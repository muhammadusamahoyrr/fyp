    TENANCY AGREEMENT

    This Tenancy Agreement is made at Lahore on 5 March 2025 between Mr. Zahid Mehmood Butt son of Abdul Majeed, resident of House No. 14, Street 6, Gulberg III, Lahore (hereinafter the "Landlord") and Mr. Faisal Anwar son of Anwar Ul Haq, CNIC 35202-1234567-1, resident of Multan (hereinafter the "Tenant").

    1. Premises. The Landlord lets to the Tenant the ground floor portion of House No. 14, Street 6, Gulberg III, Lahore, comprising three bedrooms, a drawing room and a kitchen (the "Premises").
    2. Term. The tenancy shall be for eleven (11) months commencing 1 April 2025 and ending 28 February 2026.
    3. Rent. The monthly rent shall be Rs. 85,000 payable in advance on or before the 5th day of each calendar month.
    4. Security. The Tenant has paid Rs. 170,000 as refundable security deposit, which shall be returned within 30 days of vacation of the Premises after deduction of any unpaid dues or damage.
    5. Utilities and maintenance. The Tenant shall pay electricity, gas and water bills. Minor repairs shall be borne by the Tenant; structural repairs by the Landlord.
    6. Increase. The rent shall be increased by ten percent (10%) on each renewal.
    7. Termination. Either party may terminate this tenancy by giving two months' written notice.
    8. Disputes. Any dispute arising out of this Agreement shall be referred to a sole arbitrator mutually appointed by the parties at Lahore.
    9. Governing law. This Agreement is governed by the laws of Pakistan.

    Landlord: ____________        Tenant: ____________
    Witness 1: ____________       Witness 2: ____________
