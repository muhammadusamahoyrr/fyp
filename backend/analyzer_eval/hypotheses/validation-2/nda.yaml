       2.1 Each party owes the same duties to the other; this agreement is therefore mutual.
       2.2 Each party shall use Confidential Information only for the Purpose and shall keep it confidential for five (5) years after the date above.
    3. Exclusions. Information that is or becomes public without breach, that the recipient already held, or that it received lawfully from a third party is not Confidential Information.
    4. Compelled disclosure. If law, a court or a regulator requires disclosure, the recipient shall tell the discloser promptly, where lawful, and disclose only what is required.
    5. Return. Within fourteen days of a written request, the recipient shall return or permanently destroy all Confidential Information and confirm this in writing.
    6. Disputes shall be resolved by a single arbitrator sitting at Karachi.
    7. Governing law: the laws of Pakistan.

