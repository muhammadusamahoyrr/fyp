    DATE: 20 November 2025
    PARTIES: (1) Zaman Ventures (Pvt.) Limited, Karachi; (2) Ms. Mehwish Tariq, entrepreneur, Lahore.

    1. Definitions
       1.1 "Confidential Information" means any non-public information, in any medium, about the business plans, finances, technology or customers of either party that is disclosed to the other.
