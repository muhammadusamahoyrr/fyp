    This Tenancy Agreement is made on 2 January 2026 between Haris Siddiqui (the "Landlord") and Nadia Farooq (the "Tenant").
    1. Premises
    The Landlord lets to the Tenant the house bearing No. 45, Street 7, Sector G-9/2, Islamabad.
    2. Term
    The tenancy shall be for a period of twelve months starting on 1 February 2026.
    3. Rent
    The Tenant shall pay a monthly rent of Rs. 95,000 on or before the 7th day of each month.
    4. Security Deposit
    The Tenant has paid a security deposit of Rs. 190,000, which the Landlord shall refund within thirty days of the Tenant vacating, after deducting unpaid dues.
    5. Utilities
    The Tenant shall pay the electricity, gas and water bills for the period of occupation.
    6. Rent Increase
    The rent shall increase by ten percent on any renewal of this Agreement.
    7. Termination
    Either party may terminate this Agreement by giving two months' written notice.
    8. Disputes
    Any dispute shall be referred to the courts at Islamabad.
    9. Governing Law
    This Agreement is governed by the laws of Pakistan.
    Signed by the Landlord and the Tenant in the presence of two witnesses.
