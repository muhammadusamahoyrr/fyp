# calib-1 -- the engineering calibration set for the ai-hypothesis.1 engine
# (ANALYZER_HYPOTHESES_PLAN.md §7). SYNTHETIC: every name, address, amount and
# clause was written for this set. Labels are the DEVELOPER'S (label_review:
# developer_only): what a careful reader answers to each drafting question,
# following the catalogue's own ambiguous_when wording -- never what the scanner
# happens to output, and never a statement about what the law requires. Written
# after the catalogue was frozen (0548313).
# ROLE: DEVELOPMENT SET (2026-10-03). Its first run's failures are used to
# improve the detectors, so it can never earn engineering_passed again (the most
# it reports is development_passed). The gate is validation-1. Any edit to a
# document or label is a new dataset name, never an in-place change.
