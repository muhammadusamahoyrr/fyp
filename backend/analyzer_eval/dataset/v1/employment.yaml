# Analyzer evaluation dataset v1 -- employment agreements and offer letters.
# SYNTHETIC: every employer, employee and term is made up. Labels by the
# developer, not a lawyer. The AI layer names drafting attention items only;
# no label here says what employment law requires.
documents:
- id: employment-01
  variant: clean
  text: |
    EMPLOYMENT AGREEMENT
    This Agreement is made on 1 June 2026 between Karakoram Logistics (the "Employer") and Saad Hussain (the "Employee").
    1. Position
    The Employee is appointed as Accounts Officer at the Lahore office.
    2. Salary
    The Employer shall pay a monthly salary of Rs. 150,000 by the last working day of each month.
    3. Working Hours
    The Employee shall work from 9 am to 5 pm, Monday to Friday.
    4. Probation
    The first three months of employment are a probation period.
    5. Notice
    Either party may end this Agreement by giving one month's written notice.
  expected:
    risks: []
    obligations:
    - {party: Employer, deadline: "by the last working day of each month", evidence: ["shall pay a monthly salary of Rs. 150,000"]}
    - {party: Employee, evidence: ["shall work from 9 am to 5 pm"]}

- id: employment-02
  variant: clean
  text: |
    OFFER OF EMPLOYMENT
    This letter is issued on 15 July 2026 by Gandhara Software (the "Company") to Mahnoor Rashid (the "Candidate").
    1. Role
    The Company offers the Candidate the role of Junior Developer from 1 August 2026.
    2. Pay
    The Company shall pay Rs. 120,000 per month on the 1st day of the following month.
    3. Leave
    The Candidate is entitled to twenty days of paid annual leave.
    4. Acceptance
    The Candidate shall accept this offer by signing and returning it within seven days of this letter.
  expected:
    risks: []
    obligations:
    - {party: Company, deadline: "on the 1st day of the following month", evidence: ["shall pay Rs. 120,000 per month"]}
    - {party: Candidate, deadline: "within seven days of this letter", evidence: ["shall accept this offer"]}

