# Analyzer evaluation dataset v1 -- non-disclosure agreements. SYNTHETIC: every
# company, person and term is made up. Labels by the developer, not a lawyer.
documents:
- id: nda-01
  variant: clean
  text: |
    MUTUAL NON-DISCLOSURE AGREEMENT
    This Agreement is made on 2 February 2026 between Indus Loom Traders (the "First Party") and Ravi Byte Labs (the "Second Party").
    1. Definitions
    "Confidential Information" means business plans, prices and customer lists that one party discloses to the other in writing and marks as confidential.
    2. Duties
    Each party shall keep the other party's Confidential Information secret and use it only to evaluate the proposed supply arrangement.
    3. Duration
    The duty of confidentiality lasts for three years from the date of this Agreement.
    4. Return
    Each party shall return or destroy the Confidential Information within fourteen days of a written request.
  expected:
    risks: []
    obligations:
    - {party: "Each Party", evidence: ["shall keep the other party's Confidential Information secret"]}
    - {party: "Each Party", deadline: "within fourteen days of a written request", evidence: ["shall return or destroy the Confidential Information"]}

- id: nda-02
  variant: clean
  text: |
    NON-DISCLOSURE AGREEMENT
    This Agreement is made between Margalla Foods (the "Discloser") and Nadeem Akhtar (the "Recipient").
    1. Confidential Information
    "Confidential Information" means the recipes and supplier terms the Discloser shows the Recipient during the tasting project.
    2. Obligations
    The Recipient shall not disclose the Confidential Information to any third person.
    3. Term
    These obligations continue for two years after the tasting project ends.
    4. Exclusions
    Information that is already public is not Confidential Information.
  expected:
    risks: []
    obligations:
    - {party: Recipient, evidence: ["shall not disclose the Confidential Information to any third person"]}

