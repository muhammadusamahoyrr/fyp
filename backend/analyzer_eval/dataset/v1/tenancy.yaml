# Analyzer evaluation dataset v1 -- tenancy. SYNTHETIC: every name, address,
# amount and clause is made up for this file. Labels were written by the
# developer, not a lawyer (see ../README.md). Evidence is named by a text
# fragment that must occur in exactly one evidence unit of the document.
documents:
- id: tenancy-01
  variant: clean
  text: |
    TENANCY AGREEMENT
    This Agreement is made at Lahore on 1 March 2026 between Ahmed Raza (the "Landlord") and Bilal Khan (the "Tenant").
    1. Premises
    The Landlord lets House No. 12, Street 4, Model Town, Lahore to the Tenant for residential use only.
    2. Term
    The tenancy runs for eleven months from 1 March 2026.
    3. Rent
    The Tenant shall pay rent of Rs. 85,000 by the 5th day of each month into the Landlord's bank account.
    4. Security Deposit
    The Tenant has paid a security deposit of Rs. 170,000, which the Landlord shall return within thirty days of the end of the tenancy after deducting unpaid bills.
    5. Notice
    Either party may end this Agreement by giving one month's written notice to the other party.
    6. Utilities
    The Tenant shall pay the electricity, gas and water bills for the tenancy period.
  expected:
    risks: []
    obligations:
    - {party: Tenant, deadline: "by the 5th day of each month", evidence: ["shall pay rent of Rs. 85,000"]}
    - {party: Landlord, deadline: "within thirty days of the end of the tenancy", evidence: ["which the Landlord shall return"]}
    - {party: Tenant, evidence: ["shall pay the electricity, gas and water bills"]}

